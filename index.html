<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignatureOne Mobile Notary | Trusted. Professional. Convenient.</title>
    <meta name="description" content="In-person, local mobile, and remote online notarization (RON) & loan signing agent services in Texas. Available by appointment only." />
    <meta property="og:title" content="SignatureOne Mobile Notary" />
    <meta property="og:description" content="Trusted. Professional. Convenient. Professional Notary & Loan Signing Services in Texas." />
    <meta property="og:type" content="website" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Alex+Brush&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FAF8F9] text-[#27272A] font-sans antialiased selection:bg-[#E8C9C5] selection:text-[#27272A]">
    <div id="root"></div>
    <!-- Netlify Forms detection for static SPA builds -->
    <form name="contact-inquiry" method="POST" action="/" data-netlify="true" netlify data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact-inquiry" />
      <input type="hidden" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="serviceInterest" />
      <textarea name="message"></textarea>
    </form>

    <form name="loan-signing-quote" method="POST" action="/" data-netlify="true" netlify data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="loan-signing-quote" />
      <input type="hidden" name="bot-field" />
      <input type="text" name="fullName" />
      <input type="text" name="companyName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="serviceType" />
      <input type="text" name="signerCount" />
      <input type="text" name="pageCountApprox" />
      <input type="text" name="signingLocation" />
      <input type="text" name="preferredDate" />
      <input type="text" name="preferredTime" />
      <input type="text" name="requiresScanbacks" />
      <textarea name="specialInstructions"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
